services:

  redis:
    image: redis

  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: votingdb
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  vote-app:
    image: vote-app:v1
    ports:
      - "5001:5000"
    depends_on:
      - redis

  worker:
    image: worker-app:v1
    depends_on:
      - redis
      - postgres

  result-app:
    image: result-app:v1
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres-data:
